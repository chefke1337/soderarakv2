name: Hosting ZIP (tárhelyre feltölthető statikus export)

# A hosting/** ágakra: gyökérútvonalra (basePath nélkül) épített statikus
# export, ZIP-be csomagolva, GitHub Release-ként. Semmit nem publikál a
# Pages-re. A noindex a layoutból jön, ezért ez a build is noindex marad.

on:
  push:
    branches:
      - "hosting/**"

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      GH_PAGES_BASE_PATH: ""
      NEXT_PUBLIC_SITE_URL: https://soderarak.hu
      # A tárhelyre feltöltött PHP-végpont (server/php/api → out/api).
      NEXT_PUBLIC_ORDER_API_URL: /api/rendeles.php
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: PHP endpoint tests (no real e-mail)
        run: php -v && npm run test:order-php
      - name: Build static export (root path)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: rm -rf .next out && npx next build && node scripts/prepare-static-export.mjs
      - name: Add PHP order endpoint to the export
        run: |
          mkdir -p out/api
          cp server/php/api/rendeles.php server/php/api/rendeles-adatok.php out/api/
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (browser → PHP → sendmail stub, no real e-mail)
        run: node scripts/hosting-e2e.mjs
      - name: Zip
        run: |
          cd out
          zip -qr ../soderarak-v3-tarhely.zip .
          cd ..
          ls -la soderarak-v3-tarhely.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tarhely-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          gh release create "$TAG" soderarak-v3-tarhely.zip \
            --target "$GITHUB_SHA" \
            --title "Sóder Árak V3 — tárhelyre feltölthető csomag ($TAG)" \
            --notes "Statikus export a domain gyökerére (basePath nélkül), NEXT_PUBLIC_SITE_URL=https://soderarak.hu. A ZIP tartalmát a tárhely webgyökerébe (pl. public_html) kell kicsomagolni. A rendelési igényt az api/rendeles.php (PHP 8+) küldi az info@soderarak.hu címre — beállítás: server/php/README.md. Az oldal noindex (keresőben nem jelenik meg)."
