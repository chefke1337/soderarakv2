name: Deploy Sóder Árak V3 to GitHub Pages

# V3 preview, külön cél-repóba: a statikus exportot a
# chefke1337/soderarakv3 repó saját GitHub Pages oldalára publikálja:
#   https://chefke1337.github.io/soderarakv3/
# Nem érinti a chefke1337/soderarakv2 (V2) vagy a chefke1337.github.io
# oldalt. A réteg `noindex` a layoutból jön (nem env-függő), ezért a build
# itt is noindex marad.
#
# Feltétel: a chefke1337/soderarakv3 repóban Settings → Pages → Source =
# "Deploy from a branch", branch = gh-pages, / (root). A deploy SSH deploy
# key-t használ (SODERARAKV3_DEPLOY_KEY secret, csak erre a cél-repóra kap
# írási jogot) — nem a sima GITHUB_TOKEN-t, mert az nem ír más repóba.

on:
  push:
    branches:
      - v3
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: soderarakv3-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GH_PAGES_BASE_PATH: /soderarakv3
      NEXT_PUBLIC_SITE_URL: https://chefke1337.github.io/soderarakv3
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # next/og dinamikus fallback-font letöltése (magyar ő/ű) ritkán időtúllépéssel
      # elbukik a runneren — a v2 deployból örökölt, ismert jelenség.
      - name: Build static export (basePath=/soderarakv3)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: set -o pipefail; (npx next build && node scripts/prepare-static-export.mjs) 2>&1 | tee build.log

      # Hibakereséshez: a build-kimenet vége annotációként is olvasható
      # (a nyers logok nem minden környezetből tölthetők le).
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          tail -n 60 build.log | grep -v '^\s*$' > tail.log || true
          msg=$(sed -e 's/%/%25/g' tail.log | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Build output (tail)::${msg}"

      - name: Publish to chefke1337/soderarakv3 (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SODERARAKV3_DEPLOY_KEY }}
          external_repository: chefke1337/soderarakv3
          publish_branch: gh-pages
          publish_dir: ./out
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy ${{ github.sha }}"
