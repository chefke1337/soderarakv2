name: Deploy Sóder Árak V2 to GitHub Pages

# Önálló V2 preview: a statikus exportot KIZÁRÓLAG ennek a repónak
# (chefke1337/soderarakv2) a saját GitHub Pages oldalára publikálja:
#   https://chefke1337.github.io/soderarakv2/
# Nem pushol más repóba, nem használ deploy keyt, nem érinti sem a
# chefke1337/soderarak, sem a chefke1337.github.io oldalt.
#
# Feltétel: Settings → Pages → Source = "Deploy from a branch", branch = gh-pages, / (root).
# A build-kimenet így a repó gh-pages branchén is ellenőrizhető (vizuális QA).

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: soderarakv2-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GH_PAGES_BASE_PATH: /soderarakv2
      NEXT_PUBLIC_SITE_URL: https://chefke1337.github.io/soderarakv2
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # next/og dinamikus fallback-font letöltése (magyar ő/ű) ritkán időtúllépéssel
      # elbukik a runneren — az eredeti projektből örökölt, ismert jelenség.
      - name: Build static export (basePath=/soderarakv2)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run build

      - name: Publish to gh-pages branch (same repository only)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy ${{ github.sha }}"
