name: Térkép-alapadat (OSM, egyszeri) — nem élesít
on:
  push:
    branches: ["tools/terkep-adat"]
permissions:
  contents: write
jobs:
  adat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install shapely==2.0.6
      - run: cd tools && python3 terkep_adat.py
      - name: Eredmény egy külön (nem élesítő) ágra
        run: |
          cp tools/terkep-alap.geojson /tmp/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan tools/terkep-adat-out
          git rm -rfq .
          cp /tmp/terkep-alap.geojson .
          git add terkep-alap.geojson
          git commit -qm "OSM térkép-alapadat (© OpenStreetMap közreműködők, ODbL)"
          git push -f origin tools/terkep-adat-out
