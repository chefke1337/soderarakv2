name: V3 QA (no deploy)

# Egyszeri ellenőrző futás a qa/** ágakra: a repó saját, valódi böngészős
# auditjai (axe WCAG, 360px mobil-layout, kalkulátor + rendelési igény smoke)
# — amit a fejlesztői környezet (npm nélkül) nem tud lefuttatni. Semmit nem
# publikál, és nem kerül be a v3 ágba.

on:
  push:
    branches:
      - "qa/**"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Unit tests (pricing, freight, quote, order)
        run: set -o pipefail; npm run test:all 2>&1 | tail -n 20

      # 1) A publikus előnézettel azonos build (nincs beküldési végpont, basePath)
      - name: Build (as published, basePath=/soderarakv3)
        env:
          GH_PAGES_BASE_PATH: /soderarakv3
          NEXT_PUBLIC_SITE_URL: https://chefke1337.github.io/soderarakv3
        run: (npx next build || (sleep 10 && npx next build)) && node scripts/prepare-static-export.mjs
      - name: a11y (axe WCAG A/AA) — published build
        run: set -o pipefail; npm run test:a11y 2>&1 | tail -n 40
      - name: mobile layout 360px — published build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          DAEKON_FULL_AUDIT=1 npm run test:mobile 2>&1 | tee mobile.log | tail -n 40 || {
            msg=$(tail -n 40 mobile.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=mobile audit (tail)::${msg}"; exit 1; }

      - name: Regression (browser) — published build
        shell: bash
        run: |
          set -o pipefail
          npm run test:regression 2>&1 | tee regression.log | tail -n 60 || {
            msg=$(grep -E "FAIL|regression:" regression.log | tail -n 40 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=regression::${msg}"; exit 1; }
          msg=$(grep -E "regression:" regression.log | sed -e 's/%/%25/g')
          echo "::notice title=regression::${msg}"
      - name: Lighthouse (local static server, mobile preset) — published build
        continue-on-error: true
        shell: bash
        run: |
          npm run perf:lighthouse 2>&1 | tee lh.log | tail -n 40
          msg=$(tail -n 30 lh.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=lighthouse::${msg}"

      # 2) Mock végponttal (a valódi beküldési út, MOCK jelöléssel)
      - name: Build with mock order endpoint
        env:
          NEXT_PUBLIC_ORDER_API_URL: http://127.0.0.1:8788/order
          GH_PAGES_BASE_PATH: /soderarakv3
          NEXT_PUBLIC_SITE_URL: https://chefke1337.github.io/soderarakv3
        shell: bash
        run: |
          set -o pipefail
          rm -rf .next out
          # A Google Fonts letöltése a CI-ban időnként átmenetileg elbukik → egy újrapróba.
          (npx next build || (sleep 10 && npx next build)) 2>&1 | tee mockbuild.log | tail -n 30 && node scripts/prepare-static-export.mjs 2>&1 | tail -n 10 || {
            msg=$(tail -n 40 mockbuild.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=mock build (tail)::${msg}"; exit 1; }
      - name: Smoke (calculator + order intent, mock backend)
        shell: bash
        run: |
          npm run mock:order > mock.log 2>&1 &
          sleep 3
          set -o pipefail
          npm run test:smoke 2>&1 | tee smoke.log | tail -n 80 || {
            msg=$(tail -n 50 smoke.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=smoke (tail)::${msg}"; exit 1; }
