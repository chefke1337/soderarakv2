name: V2 preview build (no deploy)

# Ellenőrző build a `preview/**` ágakra: ugyanaz a typecheck + lint +
# statikus export, mint az éles workflowban, de NEM publikál semmit.
# A kész `out/` mappa a `preview-out` ágra kerül (NEM a Pages-forrás
# gh-pages ág), onnan letöltve helyben kiszolgálható és ellenőrizhető
# jóváhagyás előtt. Az éles oldal (gh-pages) csak a main ágról frissül.

on:
  push:
    branches:
      - "preview/**"

permissions:
  contents: write

concurrency:
  group: soderarakv2-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_PAGES_BASE_PATH: /soderarakv2
      NEXT_PUBLIC_SITE_URL: https://chefke1337.github.io/soderarakv2
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export (basePath=/soderarakv2)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          shell: bash
          command: set -o pipefail; (npx next build && node scripts/prepare-static-export.mjs) 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          tail -n 60 build.log | grep -v '^\s*$' > tail.log || true
          msg=$(sed -e 's/%/%25/g' tail.log | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Build output (tail)::${msg}"

      - name: Store static export on preview-out branch (not published)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: preview-out
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Preview build ${{ github.sha }} (${{ github.ref_name }})"
